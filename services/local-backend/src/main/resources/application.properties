# ─── Server ───────────────────────────────────────────────────────────────────
# Bind ONLY to localhost — never expose to the network
server.address=127.0.0.1
server.port=48765

spring.application.name=jarvis-local-backend
spring.application.version=0.1.0

# ─── Startup Token ────────────────────────────────────────────────────────────
# Generated fresh on each launch (via environment variable set by the launcher)
# Tauri reads this from stdout and sends it as X-JARVIS-Token on every request
# NEVER hardcode a real token here — this is just a fallback for local dev
jarvis.startup-token=${JARVIS_STARTUP_TOKEN:dev-token-replace-in-production}

# ─── SQLite Database ──────────────────────────────────────────────────────────
spring.datasource.url=jdbc:sqlite:${user.home}/.jarvis/jarvis.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ─── Actuator ─────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ─── Logging ──────────────────────────────────────────────────────────────────
# Keep logs minimal — never log email content or tokens
logging.level.root=WARN
logging.level.com.jarvis=INFO
